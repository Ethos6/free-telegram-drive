[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "free-telegram-drive"
version = "0.1.0"
description = "Self-hosted, end-to-end encrypted drive that stores files in the Saved Messages of any number of Telegram accounts. Web app, WebDAV, streaming, 2FA."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "telethon>=1.40,<2",
  "cryptography>=42",
  "python-multipart>=0.0.9",
  "segno>=1.6",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "httpx>=0.27"]

[project.scripts]
tgdrive = "tgdrive.cli:main"

[tool.setuptools.packages.find]
include = ["tgdrive*"]

[tool.setuptools.package-data]
tgdrive = ["static/*", "static/icons/*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
